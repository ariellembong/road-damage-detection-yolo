# ==============================================================
# Hyperparameter Configuration for Road Damage Detection (RDD)
# Managed centrally: updates apply to all Kaggle runs via git pull
# ==============================================================

# --- Training Basics ---
epochs: 100
batch: 16
imgsz: 640
patience: 25              
optimizer: AdamW          
lr0: 0.001                
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0


device: [0, 1]
cache: ram


